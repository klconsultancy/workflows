name: Release type

# A pull request that changes what callers run (a reusable workflow, the scripts
# claude-review.yml runs) must have a title that releases (fix:, feat:, perf:, revert:, or
# a !): callers pin a release, so a `ci:` change would land on main and reach no one. On
# `edited` too, so fixing the title re-runs it.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  release-type:
    name: Release type
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # the diff against the base
          persist-credentials: false
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: .github/release-type.sh "$TITLE" "$BASE"
