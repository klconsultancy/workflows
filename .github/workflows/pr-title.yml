name: PR title

# Reusable: checks that a pull request's title is a Conventional Commit, the squash
# commit's message. Callers run it on pull_request: it only reads the title, so the
# read-only token of a fork's run is enough, and a pull request adding the caller
# gets the check itself.
#
# Caller (.github/workflows/pr-title.yml in a repository):
#
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, reopened]
#   permissions: {}
#   jobs:
#     title:
#       name: PR title
#       permissions:
#         pull-requests: read
#       uses: klconsultancy/workflows/.github/workflows/pr-title.yml@<sha> # main
#
# The required status check is then "PR title / Conventional commit title".
#
# With a merge queue, add `merge_group:` to the caller's triggers: a required check must
# report on the queue's merge group too. The title was checked on the pull request; the
# group has none, so the job passes there without checking.

on:
  workflow_call:

permissions: {}

jobs:
  conventional-commit:
    name: Conventional commit title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - if: github.event_name != 'merge_group'
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: github.event_name == 'merge_group'
        run: echo "Checked on the pull request."
