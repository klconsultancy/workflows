name: PR title

# Reusable: checks that a pull request's title is a Conventional Commit, the squash
# commit's message. Callers run it on pull_request: it only reads the title, so the
# read-only token of a fork's run is enough, and a pull request adding the caller
# gets the check itself.
#
# Caller (.github/workflows/pr-title.yml in a repository):
#
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, reopened]
#     merge_group: # only with a merge queue
#   permissions: {}
#   jobs:
#     title:
#       name: PR title
#       permissions:
#         pull-requests: read
#       # zizmor: ignore[ref-version-mismatch] the pin trails main until Renovate moves it
#       uses: klconsultancy/workflows/.github/workflows/pr-title.yml@<sha> # main
#
# The required status check is then "PR title / Conventional commit title". With a merge
# queue, a required check must also report on the queue's merge group: there it passes
# without a check, because the group has no title and the pull request's was checked.

on:
  workflow_call:

permissions: {}

jobs:
  conventional-commit:
    name: Conventional commit title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - if: github.event_name != 'merge_group'
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: github.event_name == 'merge_group'
        run: echo "Checked on the pull request."
