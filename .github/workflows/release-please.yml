name: Release please

# Reusable: release-please keeps a release pull request open with the next version and its
# changelog, from the Conventional Commits titles on main. Merging it tags the release and
# creates the GitHub release. release-please acts as a GitHub App rather than GITHUB_TOKEN,
# so CI runs on the release pull request; the app may also create the version tags a
# "release tags" ruleset protects.
#
# A release candidate is a tag such as v1.2.3-rc.1 on main, pushed by an admin. With
# `release-candidates: true` it becomes a GitHub pre-release here (HACS offers those to
# users who enabled beta versions). release-please doesn't see it, so the final release's
# notes still cover everything since the last stable release. A repository that builds
# something for its release candidates (PyPI, binaries, images) leaves this off and
# creates the pre-release itself, after the build.
#
# Release assets: with `assets` set, the files a release needs (a HACS zip, say) are built by
# `assets-command` in a checkout of the release's tag and attached to the release, after
# release-please creates it and, with `release-candidates: true`, after a release
# candidate's pre-release. The command runs without any token: the checkout uses a
# read-only one, and only a second job, which runs nothing of the repository's, uploads.
#
# Outputs, for the caller's own release jobs (binaries, images, PyPI):
#   release_created  'true' when this push to main created a release
#   tag_name         that release's tag
# On a tag push both are empty: use `github.ref_name` there.
#
# Needs, in the calling repository (or once for the organization):
# - the variable RELEASE_APP_CLIENT_ID and the secret RELEASE_APP_PRIVATE_KEY, of a
#   GitHub App installed on the repository
#
# Caller (.github/workflows/release.yml in a repository):
#
#   on:
#     push:
#       branches: [main]
#       tags: ["v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"] # only with release candidates
#   permissions: {}
#   jobs:
#     release:
#       permissions: {} # both jobs act as the app
#       uses: klconsultancy/workflows/.github/workflows/release-please.yml@<sha> # main
#       with:
#         app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
#         release-candidates: true
#         # only for release assets:
#         assets-command: python3 -m script.release_zip "$TAG" my_integration.zip
#         assets: my_integration.zip
#       secrets:
#         RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
#     publish:
#       needs: release
#       if: needs.release.outputs.release_created == 'true'
#       ...

on:
  workflow_call:
    inputs:
      app-client-id:
        description: Client ID of the GitHub App release-please acts as.
        type: string
        required: true
      release-candidates:
        description: >-
          Turn a pushed release-candidate tag (v1.2.3-rc.1) into a GitHub pre-release with
          generated notes, as the app.
        type: boolean
        default: false
      assets-command:
        description: >-
          The command that builds the release's assets, run with bash in a checkout of the
          release's tag, with the tag in $TAG and no token.
        type: string
        default: ""
      assets:
        description: >-
          The files to attach to the release (and to a release candidate's pre-release):
          paths or globs relative to the checkout, one per line; empty attaches nothing.
        type: string
        default: ""
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true
    outputs:
      release_created:
        description: "'true' when this push to main created a release."
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: The created release's tag.
        value: ${{ jobs.release-please.outputs.tag_name }}

permissions: {}

jobs:
  release-please:
    name: Release PR
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions: {} # it acts as the app
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # No permission-* list: the app holds only what release-please needs, and a list
          # here would only drift from it (.github/zizmor.yml).
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  release-candidate:
    name: Release candidate
    if: github.ref_type == 'tag' && inputs.release-candidates
    runs-on: ubuntu-latest
    # The app creates the pre-release too: GitHub checks a called job's permissions against
    # the caller's before any `if:`, so a `contents: write` here would make every caller
    # grant it, release candidates or not.
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.ref_name }}
        # release-please also tags a release candidate it releases itself (release-as with
        # prerelease), and creates its release first: leave that one be.
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists already."
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --generate-notes --title "$TAG"

  assets:
    name: Build release assets
    needs: [release-please, release-candidate]
    # A skipped job skips the jobs that need it, unless always(): one of the two always is.
    if: >-
      always() && inputs.assets != '' &&
      (needs.release-please.outputs.release_created == 'true' ||
      needs.release-candidate.result == 'success')
    runs-on: ubuntu-latest
    permissions: {} # the checkout uses a read-only app token
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a tag push release-please's outputs are empty: the tag is the pushed ref.
          ref: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Build
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
          ASSETS_COMMAND: ${{ inputs.assets-command }}
        run: bash -euo pipefail -c "$ASSETS_COMMAND"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ inputs.assets }}
          if-no-files-found: error
          retention-days: 1

  upload:
    name: Upload release assets
    needs: [release-please, assets]
    if: always() && needs.assets.result == 'success'
    runs-on: ubuntu-latest
    permissions: {} # it acts as the app
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
        # A release without its assets may be one nobody can install: retry, then check.
        run: |
          mapfile -t files < <(find assets -type f | sort)
          for attempt in 1 2 3; do
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber && break
            echo "Upload attempt $attempt failed."
            sleep 10
          done
          attached=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for file in "${files[@]}"; do
            grep -qxF "$(basename "$file")" <<<"$attached" \
              || { echo "::error::$TAG has no $(basename "$file")"; exit 1; }
          done
