rules:
  # The Renovate and release apps hold only what their tool needs; a permission-* list
  # would only drift from them.
  github-app:
    ignore:
      - release-please.yml
      - renovate.yml

  # The image is the caller's input: pinning it (by digest) is the caller's to do.
  unpinned-images:
    ignore:
      - zizmor.yml
