name: Release please

# Reusable: release-please keeps a release pull request open with the next version and its
# changelog, from the Conventional Commits titles on main. Merging it tags the release and
# creates the GitHub release. release-please acts as a GitHub App rather than GITHUB_TOKEN,
# so CI runs on the release pull request; the app may also create the version tags a
# "release tags" ruleset protects.
#
# A release candidate is a tag such as v1.2.3-rc.1, pushed by an admin; a repository has
# them when its caller triggers on such tags. Every pushed tag is checked first: it must be
# a candidate of the release release-please has pending (that release pull request's
# version, the tagged commit on its base branch). The output `release_candidate` is then
# 'true'; a tag that is not fails the check, and nothing of it is built or released.
# With `create-prerelease: true` a checked candidate becomes a GitHub pre-release here (HACS
# offers those to users who enabled beta versions). A repository that builds something for
# its release candidates (PyPI, binaries, images) leaves it off and creates the pre-release
# itself, after its build, behind `needs.<job>.outputs.release_candidate == 'true'`.
# release-please doesn't see release candidates, so the final release's notes still cover
# everything since the last stable release.
#
# Release assets: with `assets` set, the files a release needs (a HACS zip, say) are built by
# `assets-command` in a checkout of the release's tag and attached to the release, after
# release-please creates it and, with `create-prerelease: true`, after a release
# candidate's pre-release. The command runs without any token: the checkout uses a
# read-only one, and only a second job, which runs nothing of the repository's, uploads.
#
# Immutable releases: a published release takes no new assets, so a release with assets is
# made as a draft, gets its assets, and is published only then (job "Publish release"). A
# release candidate's pre-release is a draft here already. For release-please's own
# releases the caller's release-please-config.json sets `"draft": true` and
# `"force-tag-creation": true` (GitHub tags a draft only when it is published, and
# release-please needs the tag to find the previous release). A draft whose assets fail is
# never published: fix the cause and re-run the failed jobs. Without `assets` no draft is
# published here: a caller that attaches files of its own publishes its draft itself.
#
# Outputs, for the caller's own release jobs (binaries, images, PyPI):
#   release_created    'true' when this push to main created a release
#   tag_name           that release's tag
#   release_candidate  'true' when this push is of a checked release candidate tag
# On a tag push the first two are empty: use `github.ref_name` there.
#
# Needs, in the calling repository (or once for the organization):
# - the variable RELEASE_APP_CLIENT_ID and the secret RELEASE_APP_PRIVATE_KEY, of a
#   GitHub App installed on the repository
#
# Caller (.github/workflows/release.yml in a repository):
#
#   on:
#     push:
#       branches: [main]
#       tags: ["v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"] # only with release candidates
#   permissions: {}
#   jobs:
#     release:
#       permissions: {} # its jobs act as the app
#       uses: klconsultancy/workflows/.github/workflows/release-please.yml@<sha> # v1.0.0
#       with:
#         app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
#         create-prerelease: true # only with release candidates
#         # only for release assets:
#         assets-command: python3 -m script.release_zip "$TAG" my_integration.zip
#         assets: my_integration.zip
#       secrets:
#         RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
#     publish:
#       needs: release
#       if: needs.release.outputs.release_created == 'true'
#       ...
#     publish-release-candidate: # with create-prerelease off
#       needs: release
#       if: needs.release.outputs.release_candidate == 'true'
#       ...

on:
  workflow_call:
    inputs:
      app-client-id:
        description: Client ID of the GitHub App release-please acts as.
        type: string
        required: true
      create-prerelease:
        description: >-
          Turn a checked release-candidate tag (v1.2.3-rc.1) into a GitHub pre-release with
          generated notes, as the app. Off for a repository that creates it itself, after
          its own build.
        type: boolean
        default: false
      assets-command:
        description: >-
          The command that builds the release's assets, run with bash in a checkout of the
          release's tag, with the tag in $TAG and no token.
        type: string
        default: ""
      assets:
        description: >-
          The files to attach to the release (and to a release candidate's pre-release):
          paths or globs relative to the checkout, one per line; empty attaches nothing.
        type: string
        default: ""
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true
    outputs:
      release_created:
        description: "'true' when this push to main created a release."
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: The created release's tag.
        value: ${{ jobs.release-please.outputs.tag_name }}
      release_candidate:
        description: "'true' when this push is of a release-candidate tag that passed the check."
        value: ${{ jobs.check-release-candidate.outputs.release_candidate }}

permissions: {}

jobs:
  release-please:
    name: Release PR
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions: {} # it acts as the app
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # No permission-* list: the app holds only what release-please needs, and a list
          # here would only drift from it (.github/zizmor.yml).
      # release-please creates a release without make_latest, so GitHub makes every new
      # release "Latest", a maintenance branch's v1.4.1 after main's v2.0.0 too, and HACS,
      # /releases/latest and `gh release download` would then offer the old major. On a
      # maintenance branch the latest release is noted here and made latest again below.
      - id: latest
        if: github.ref_name != github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          # The pushed branch, not the repository's default: a maintenance branch (1.x) gets
          # release pull requests and releases of its own.
          target-branch: ${{ github.ref_name }}
      # Only when that release is the higher version: a maintenance branch cut before main's
      # next major has the newest release (v1.4.1 after v1.4.0), and keeps "Latest".
      - if: steps.release.outputs.release_created == 'true' && steps.latest.outputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LATEST: ${{ steps.latest.outputs.tag }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [[ $(printf '%s\n' "$LATEST" "$TAG" | sort -V | tail -n1) == "$TAG" ]]; then
            echo "$TAG is newer than $LATEST: it stays Latest."
          else
            echo "$LATEST is newer than $TAG: it is made Latest again."
            gh release edit "$LATEST" --repo "$GITHUB_REPOSITORY" --latest
          fi

  check-release-candidate:
    name: Check release candidate
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions: {} # it reads as the app
    outputs:
      release_candidate: ${{ steps.check.outputs.release_candidate }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.ref_name }}
        # A tag whose release exists is release-please's own (it creates the release first,
        # a release candidate it releases itself too) or a re-run: not a new candidate.
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists already: not a new release candidate."
            exit 0
          fi

          # A release candidate is one of the release that release-please has pending: the
          # tag's version is that release pull request's, and the tagged commit is on its
          # base branch. Anything else fails here, before a pre-release or its assets; the
          # tag is left for a person to delete.
          if ! [[ $TAG =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a release candidate tag (v1.2.3-rc.1)."
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          pending=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" \
            --json number,baseRefName,headRefName --jq '.[] | "\(.number) \(.baseRefName) \(.headRefName)"')
          if [[ -z $pending ]]; then
            echo "::error::No release pull request is open, so $TAG is a candidate of no release."
            exit 1
          fi
          found=()
          while read -r number base head; do
            pr_versions=$(gh api "repos/$GITHUB_REPOSITORY/contents/.release-please-manifest.json?ref=$head" \
              --jq '.content | @base64d | fromjson | [.[]] | join(" ")')
            found+=("#$number on $base: $pr_versions")
            [[ " $pr_versions " == *" $version "* ]] || continue
            # The tagged commit must be on the base branch: the branch is ahead of it or at it.
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$base" --jq .status)
            if [[ $status != ahead && $status != identical ]]; then
              echo "::error::$TAG matches #$number, but its commit ${GITHUB_SHA::7} is not on $base."
              exit 1
            fi
            echo "$TAG is a candidate of #$number ($version, on $base)."
            echo "release_candidate=true" >> "$GITHUB_OUTPUT"
            exit 0
          done <<<"$pending"
          echo "::error::$TAG is a candidate of $version, but the pending release is another: ${found[*]}."
          exit 1

  release-candidate:
    name: Release candidate
    needs: check-release-candidate
    if: inputs.create-prerelease && needs.check-release-candidate.outputs.release_candidate == 'true'
    runs-on: ubuntu-latest
    # The app creates the pre-release too: GitHub checks a called job's permissions against
    # the caller's before any `if:`, so a `contents: write` here would make every caller
    # grant it, release candidates or not.
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.ref_name }}
          ASSETS: ${{ inputs.assets }}
        # With assets a draft, which "Publish release" publishes once they are attached: an
        # immutable release takes no new assets.
        run: |
          draft=()
          [[ -n $ASSETS ]] && draft=(--draft)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --generate-notes --title "$TAG" "${draft[@]}"

  assets:
    name: Build release assets
    needs: [release-please, release-candidate]
    # A skipped job skips the jobs that need it, unless always(): one of the two always is.
    if: >-
      always() && inputs.assets != '' &&
      (needs.release-please.outputs.release_created == 'true' ||
      needs.release-candidate.result == 'success')
    runs-on: ubuntu-latest
    permissions: {} # the checkout uses a read-only app token
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a tag push release-please's outputs are empty: the tag is the pushed ref.
          ref: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Build
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
          ASSETS_COMMAND: ${{ inputs.assets-command }}
        run: bash -euo pipefail -c "$ASSETS_COMMAND"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ inputs.assets }}
          if-no-files-found: error
          retention-days: 1

  upload:
    name: Upload release assets
    needs: [release-please, assets]
    if: always() && needs.assets.result == 'success'
    runs-on: ubuntu-latest
    permissions: {} # it acts as the app
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
        # A release without its assets may be one nobody can install: retry, then check.
        run: |
          mapfile -t files < <(find assets -type f | sort)
          for attempt in 1 2 3; do
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber && break
            echo "Upload attempt $attempt failed."
            sleep 10
          done
          read -r draft attached < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,assets --jq '"\(.isDraft) \([.assets[].name] | join(" "))"')
          for file in "${files[@]}"; do
            [[ " $attached " == *" $(basename "$file") "* ]] && continue
            echo "::error::$TAG has no $(basename "$file")."
            if [[ $draft != true ]]; then
              echo "::error::$TAG was published before its assets, and an immutable release takes none: set \"draft\": true and \"force-tag-creation\": true in release-please-config.json."
            fi
            exit 1
          done

  publish:
    name: Publish release
    needs: [release-please, upload]
    # Only a release whose assets this workflow attached: a draft whose assets failed stays a
    # draft, and a caller's own draft (its binaries, in a job after this workflow) is the
    # caller's to publish.
    if: always() && inputs.assets != '' && needs.upload.result == 'success'
    runs-on: ubuntu-latest
    permissions: {} # it acts as the app
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
        # A published draft becomes "Latest" unless told otherwise: only a release that is
        # the highest version is (not a maintenance branch's v1.4.1 after v2.0.0).
        run: |
          read -r draft prerelease < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')
          if [[ $draft != true ]]; then
            echo "$TAG is published already."
            exit 0
          fi
          args=(--draft=false)
          if [[ $prerelease != true ]]; then
            latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
            if [[ -z $latest || $(printf '%s\n' "$latest" "$TAG" | sort -V | tail -n1) == "$TAG" ]]; then
              args+=(--latest)
            else
              echo "$latest is newer than $TAG: it stays Latest."
              args+=(--latest=false)
            fi
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${args[@]}"
          echo "Published $TAG."
