name: Test

# The shell scripts behind the reusable workflows (shellcheck, bats), and the workflows
# themselves (actionlint, zizmor).

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bats
        run: sudo apt-get update -q && sudo apt-get install -y -q bats
      - name: shellcheck
        run: shellcheck .github/claude-review/*.sh
      - name: bats
        run: bats test/

  # The reusable zizmor workflow, as the pull request changes it: it runs live before any
  # caller moves its pin.
  zizmor:
    name: zizmor
    permissions:
      contents: read
    # `$/...` (self-repository syntax) once actionlint understands it; 1.7.12 rejects it.
    uses: ./.github/workflows/zizmor.yml # zizmor: ignore[self-repository]
    with:
      config: .github/zizmor.yml

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The official image (actionlint with shellcheck for run: blocks), pinned by digest.
      - uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
