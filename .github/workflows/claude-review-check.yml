name: Claude review

# Dogfooding: this repository's pull requests are reviewed by the Claude review workflow. Fork
# pull requests are skipped by the workflow itself (and get no secrets). A pull request that
# changes this file or claude-review.yml is red: the Claude GitHub App only serves a caller,
# and a reusable workflow it takes from this repository, identical to main's. A change to the
# review is therefore tested after the merge, in a caller, before its pin moves elsewhere.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

jobs:
  review:
    name: Review
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    # `$/...` (self-repository syntax) once actionlint understands it; 1.7.12 rejects it.
    uses: ./.github/workflows/claude-review.yml # zizmor: ignore[self-repository]
    with:
      guidelines: README.md
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
