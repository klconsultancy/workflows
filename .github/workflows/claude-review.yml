name: Claude review

# Reusable: every repository in the organization calls this on its pull requests.
# Claude reviews against the calling repository's own CLAUDE.md / AGENTS.md and posts
# inline comments, or one summary comment when it finds nothing. It comments; it never
# approves, so a person still merges.
#
# Needs, once per organization:
# - the Claude GitHub App (https://github.com/apps/claude), on all repositories
# - the Actions secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`)
#
# Caller (.github/workflows/claude-review.yml in a repository):
#
#   on:
#     pull_request:
#       types: [opened, synchronize, ready_for_review, reopened]
#   permissions: {}
#   jobs:
#     review:
#       permissions:
#         contents: read
#         pull-requests: read
#         issues: read
#         id-token: write
#       uses: klconsultancy/workflows/.github/workflows/claude-review.yml@<sha> # main
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

on:
  workflow_call:
    inputs:
      max-turns:
        description: Cap on Claude's turns per review.
        type: number
        default: 40
      timeout-minutes:
        description: Cap on the job's run time.
        type: number
        default: 20
      guidelines:
        description: >-
          More of the calling repository's guideline files to review against, space-separated
          paths (e.g. docs/design/README.md). CLAUDE.md is always read.
        type: string
        default: ""
      show-full-output:
        description: >-
          Print Claude's full transcript, tool results included, in the job log: to see what a
          review read and why. Private repositories only, and only for a while.
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions: {}

jobs:
  review:
    name: Review
    # Not for drafts, not for bots (Renovate, release-please: the action refuses bot
    # actors anyway), and not for forks: GitHub withholds the secret from those runs.
    if: >-
      !github.event.pull_request.draft
      && github.event.pull_request.user.type != 'Bot'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      # A new push replaces the review of the previous one.
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # the action authenticates as the Claude GitHub App
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: ${{ inputs.show-full-output }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: >-
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            ${{ inputs.guidelines != '' && format('--append-system-prompt "Also read these guideline files of this repository and review against them, as you do against CLAUDE.md: {0}"', inputs.guidelines) || '' }}
