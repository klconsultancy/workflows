name: Python

# Reusable: lint, type-check, test and (optionally) build a Python project managed with uv.
# Everything runs through `uv run` against the locked environment (`uv sync --locked`), so
# the tools and their versions are the project's own (ruff, mypy and pytest in its dev
# dependencies). Tests that are particular to one project (a dependency's lowest or newest
# version) stay jobs in that project's CI.
#
# Caller (a job in the repository's CI workflow):
#
#   permissions: {}
#   jobs:
#     python:
#       permissions:
#         contents: read
#       uses: klconsultancy/workflows/.github/workflows/python-uv.yml@<sha> # main
#       with:
#         test-python-versions: '["3.12", "3.13", "3.14"]'
#         build: true
#
# The checks are then "python / Lint & type-check", "python / Test (Python <version>)" and
# "python / Build distribution".

on:
  workflow_call:
    inputs:
      python-version:
        description: Python for lint, type-check and build (the devcontainer's).
        type: string
        default: "3.14"
      test-python-versions:
        description: Python versions to test on, a JSON array.
        type: string
        default: '["3.14"]'
      mypy:
        description: Type-check with `uv run mypy`.
        type: boolean
        default: true
      check-uv-pins:
        description: >-
          Fail when the uv version differs between .devcontainer/Dockerfile (FROM
          ghcr.io/astral-sh/uv:<version>, with or without a digest), pyproject.toml (required-version = "==<version>")
          and .pre-commit-config.yaml (astral-sh/uv-pre-commit's rev). Renovate groups them;
          this catches drift.
        type: boolean
        default: false
      build:
        description: >-
          Build the distribution and check its metadata as PyPI would (`twine check
          --strict`, from the project's `release` dependency group), so a broken
          pyproject.toml shows up before a release.
        type: boolean
        default: false

permissions: {}

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: uv version is pinned consistently
        if: inputs.check-uv-pins
        run: |
          docker=$(sed -nE 's#^FROM ghcr\.io/astral-sh/uv:([0-9.]+)([@ ].*)?$#\1#p' .devcontainer/Dockerfile)
          pyproject=$(sed -nE 's|^required-version = "==([0-9.]+)"$|\1|p' pyproject.toml)
          hook=$(grep -A1 'astral-sh/uv-pre-commit' .pre-commit-config.yaml | sed -nE 's|^ *rev: ([0-9.]+)$|\1|p')
          echo "Dockerfile: $docker, pyproject.toml: $pyproject, .pre-commit-config.yaml: $hook"
          if [ -z "$docker" ] || [ "$docker" != "$pyproject" ] || [ "$docker" != "$hook" ]; then
            echo "::error::uv versions differ: Dockerfile '$docker', pyproject.toml '$pyproject', .pre-commit-config.yaml '$hook'"
            exit 1
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.python-version }}
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check --output-format=github
      - if: inputs.mypy
        run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.test-python-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest

  build:
    name: Build distribution
    if: inputs.build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.python-version }}
      - run: uv build
      - run: uv run --locked --only-group release twine check --strict dist/*
